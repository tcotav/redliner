name: Release Go binaries

# Builds the go/cmd/redliner binary for every platform in the matrix and
# attaches it to a GitHub Release, plus a checksums.txt. This is the
# distribution mechanism TODO.md's "Port to a compiled language" section
# settled on in place of committing binaries to the tracked tree
# permanently (see the 2026-08-12 "Superseded" note there) -- the
# download-on-install hooks in hooks/ and cowork/hooks/ fetch exactly
# what this workflow publishes.
#
# Platform scope: Phase 6 said darwin/arm64 only "to start ... revisit
# once the port itself is proven". Expanded 2026-08-31, the port having
# been proven -- the 2026-08-31 complexity audit's finding that every
# novelist not on Apple Silicon was at zero is what prompted it.
#
# Windows is deliberately NOT in the matrix. Adding it is not a one-line
# change: `uname -s` under MSYS/git-bash reports `mingw64_nt-10.0`, not
# `windows`, so the bootstrap hooks' OS detection would build an asset
# name no release contains, and Go emits a `.exe` the OUT name below
# doesn't account for. Ship it when both halves are handled and testable,
# not by adding a pair to this list.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (without a leading v), e.g. 0.1.0 -- for a manual test run, not tied to a real tag"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build binaries
        # Go cross-compiles without a matching-OS runner -- GOOS/GOARCH
        # env vars are all `go build` needs, so this runs on the cheapest
        # available runner (ubuntu) rather than requiring a macOS one
        # just to produce a darwin binary.
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          # (GOOS, GOARCH) pairs -- add entries here to expand platform
          # coverage. These four are exactly the ones the bootstrap
          # hooks' `uname`-based detection can name; see this workflow's
          # header comment for why Windows is not among them.
          PLATFORMS="darwin/arm64 darwin/amd64 linux/amd64 linux/arm64"
          cd go
          for platform in $PLATFORMS; do
            GOOS="${platform%/*}"
            GOARCH="${platform#*/}"
            OUT="../dist/redliner-${VERSION}-${GOOS}-${GOARCH}"
            echo "Building $OUT"
            # -X stamps the version into the binary so it can answer
            # `redliner version` and report an honest serverInfo over
            # MCP. Without this the binary defaults to "dev" and the only
            # version signal is bin/redliner.version, a sidecar the
            # installer writes about its own intent -- see
            # internal/buildinfo's doc comment for why that mattered.
            GOOS="$GOOS" GOARCH="$GOARCH" CGO_ENABLED=0 go build \
              -ldflags "-X github.com/tcotav/redliner/go/internal/buildinfo.Version=${VERSION}" \
              -o "$OUT" ./cmd/redliner
          done

          # A release binary that reports "dev" would defeat the point,
          # and an ldflags path typo fails silently (the linker does not
          # error on an unknown -X target). Check the native build here,
          # where a mismatch fails the release instead of shipping.
          NATIVE="../dist/redliner-${VERSION}-linux-amd64"
          REPORTED="$("$NATIVE" version)"
          if [ "$REPORTED" != "$VERSION" ]; then
            echo "Built binary reports version '$REPORTED', expected '$VERSION' -- the -X path is probably wrong" >&2
            exit 1
          fi
          echo "Version stamp verified: $REPORTED"

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 * > checksums.txt
          cat checksums.txt

      - name: Create release (real tag push only)
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

      - name: Upload build artifacts (manual dispatch runs, no release)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: redliner-binaries-${{ steps.version.outputs.version }}
          path: dist/
